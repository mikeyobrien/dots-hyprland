# BambuStudio XWayland fixes
# ABOUTME: Configuration to fix BambuStudio rendering issues on Hyprland
# ABOUTME: Includes XWayland settings and window rules for proper display

# XWayland configuration
xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = false
}

# Environment variables for better XWayland compatibility
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = XCURSOR_SIZE,24

# Window rules for BambuStudio
windowrulev2 = immediate,class:^(bambustu)
windowrulev2 = noblur,class:^(bambustu)
windowrulev2 = noshadow,class:^(bambustu)
windowrulev2 = forcergbx,class:^(bambustu)
windowrulev2 = rounding 0,class:^(bambustu)

# Additional rules to prevent rendering issues
windowrulev2 = noanim,class:^(bambustu)
windowrulev2 = noborder,class:^(bambustu)