# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# Monitor configuration is handled automatically by monitor-switch.sh
# which runs on startup and detects the appropriate profile
# The active profile is symlinked to active.conf
# source=~/.config/hypr/monitor-profiles/active.conf

input {
    # Remap Caps Lock to Ctrl
    kb_options = ctrl:nocaps
}

# XWayland configuration
xwayland {
    force_zero_scaling = true
}
