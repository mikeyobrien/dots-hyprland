# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Force XWayland apps to respect scaling
windowrule = force_rgbx 1, match:xwayland 1

# Battle.net launcher under Proton/UMU shows up as steam_app_default.
# Keep only the launcher floating; do not apply this to launched games like Diablo IV.
windowrule = float 1, match:class ^(steam_app_default)$, match:title ^(Battle\.net.*)$
windowrule = size 1200 760, match:class ^(steam_app_default)$, match:title ^(Battle\.net.*)$
windowrule = center 1, match:class ^(steam_app_default)$, match:title ^(Battle\.net.*)$

# Workspace assignments are now handled in monitor profiles
# See ~/.config/hypr/monitor-profiles/
