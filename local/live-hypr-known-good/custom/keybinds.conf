# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

# Brightness controls (AMD/NVIDIA fallback)
bindle=, XF86MonBrightnessUp, exec, ~/.config/hypr/hyprland/scripts/brightness-step.sh up # [hidden]
bindle=, XF86MonBrightnessDown, exec, ~/.config/hypr/hyprland/scripts/brightness-step.sh down # [hidden]

##! Monitor Management
bind = Super+Shift, M, exec, ~/.config/hypr/scripts/monitor-switch.sh auto # Auto-detect monitor profile
bind = Super+Shift, N, exec, ghostty --class monitor-selector bash -c '~/.config/hypr/scripts/monitor-switch.sh list; echo ""; read -p "Enter profile name to load: " profile; ~/.config/hypr/scripts/monitor-switch.sh load "$profile"' # Select monitor profile

